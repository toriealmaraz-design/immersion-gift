<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A Galaxy of Love for You — Immersion Gift</title>
  <meta name="description" content="A immersive multi-page romantic digital gift: 3D galaxy universe portal." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,500&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.stylesheet.css" />
</head>
<body>

<!-- ═══ QR CODE MODAL (scannable link — open from WhatsApp / text) ═══ -->
<div class="qr-modal-backdrop" id="qrModal" hidden aria-hidden="true">
  <div class="qr-modal" role="dialog" aria-modal="true" aria-label="Scannable link">
    <div class="qr-title">A Galaxy of Love for You</div>
    <div class="qr-sub">Scan this code to open the gift</div>
    <div class="qr-panel">
      <img id="qrCodeImg" src="assets/images/qr-code.png" alt="QR code linking to the gift" />
    </div>
    <p class="qr-copy" id="qrUrlCopy">https://toriealmaraz-design.github.io/immersion-gift/</p>
    <div class="qr-actions">
      <button class="btn" id="qrOpenBtn">Open the gift</button>
      <button class="btn btn-outline" id="qrCloseBtn">Close</button>
    </div>
  </div>
</div>

<!-- ═══ ONSCREEN 3D ENTRY (the scannable gateway) ═══ -->
<div class="entry-overlay" id="entryOverlay" aria-label="3D entry gateway">
  <div class="entry-stardust" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span>
  </div>
  <div class="entry-card glass" id="entryCard">
    <div class="entry-title glow">A Galaxy of Love for You</div>
    <div class="entry-sub">Happy Birthday, My Love</div>
    <div style="margin-top: var(--space-4); display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); flex-wrap: wrap;">
      <button class="btn" id="openUniverse">Step Into the Universe</button>
      <p style="margin: 0; font-size: 0.85rem; color: var(--ink-muted);">
        Tap also <a href="#" id="openQRFromMobile" style="color: var(--pink); font-weight: 600; text-decoration: underline;">View the gift</a>
      </p>
    </div>
  </div>
</div>

<!-- ═══ THREE.JS GALAXY SCENE ═══════════════════════════════════════════ -->
<div class="galaxy-scene" id="galaxyScene" aria-hidden="true"></div>

<!-- ═══ ORBITING FLOATERS ══════════════════════════════════════════════ -->
<div class="floaters" id="floaters" aria-hidden="true">
  <div class="floater" data-text="Happy Birthday">Happy Birthday</div>
  <div class="floater" data-text="You're Magic">You're Magic</div>
  <div class="floater" data-text="My Eternal Love">My Eternal Love</div>
  <div class="floater" data-text="I Adore You">I Adore You</div>
  <div class="floater" data-text="Always Together">Always Together</div>
  <div class="floater" data-text="Mi Amor">Mi Amor</div>
</div>

<!-- ═══ NAVIGATION DOCK ════════════════════════════════════════════════ -->
<nav class="nav-dock" aria-label="Universe portal navigation">
  <a href="index.html" class="nav-item active" data-page="universe">
    <span class="nav-icon">✦</span>
    <span class="nav-label">Universe</span>
  </a>
  <a href="letters.html" class="nav-item" data-page="letters">
    <span class="nav-icon">✉</span>
    <span class="nav-label">Letters</span>
  </a>
  <a href="memories.html" class="nav-item" data-page="memories">
    <span class="nav-icon">◈</span>
    <span class="nav-label">Memories</span>
  </a>
</nav>

<!-- ═══ FALLBACK (JS off) ══════════════════════════════════════════════ -->
<noscript>
  <div class="glass" style="padding: var(--space-6); text-align: center;">
    <p style="font-family: var(--font-display); font-size: 1.4rem;">A Galaxy of Love for You</p>
    <p style="color: var(--ink-soft);">Enable JavaScript for the 3D galaxy experience.</p>
  </div>
</noscript>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/three-scene.js"></script>
</body>
</html>
